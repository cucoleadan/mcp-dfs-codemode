name: Sync Upstream

on:
  schedule:
    # Weekly: Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/dataforseo/mcp-server-typescript.git
          git fetch upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master 2>/dev/null || echo "0")
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "Upstream commits behind: $BEHIND"

      - name: Create sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          BRANCH="sync/upstream-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git pull upstream master --no-edit --allow-unrelated-histories || true
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        id: branch

      - name: Push sync branch
        if: steps.check.outputs.behind != '0'
        run: |
          git push origin "${{ steps.branch.outputs.branch }}"

      - name: Open sync PR
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_LOG=$(git log HEAD..upstream/master --oneline --no-decorate 2>/dev/null | head -50)
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "Sync upstream $(date +%Y-%m-%d)" \
            --body "## Upstream changes from \`dataforseo/mcp-server-typescript\`

New commits in upstream that need review:

\`\`\`
$UPSTREAM_LOG
\`\`\`

> **Note:** This PR was auto-generated by the \`sync-upstream.yml\` workflow.
> Review and resolve any conflicts before merging."
